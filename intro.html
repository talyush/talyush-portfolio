<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #333;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            max-width: 800px;
            padding: 20px;
        }

        .encrypted-text {
            font-size: 28px;
            line-height: 1.8;
            letter-spacing: 3px;
            color: #1a1a1a;
            font-weight: bold;
            margin-bottom: 40px;
            max-width: 700px;
            word-wrap: break-word;
        }

        .subtitle {
            font-size: 12px;
            color: #0a0a0a;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Fade in animation */
        .container {
            animation: fadeIn 2s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Fade out before redirect */
        .fade-out {
            animation: fadeOut 1.5s ease-out forwards;
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        /* Glitch effect on hover */
        .encrypted-text:hover {
            color: #0a0a0a;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="encrypted-text">
            dGhlIG9ubHkgd2F5IHRvIGRlYWwgd2l0aCBhbiB1bmZyZWUgd29ybGQgaXMgdG8gYmVjb21lIHNvIGFic29sdXRlbHkgZnJlZSB0aGF0IHlvdXIgdmVyeSBleGlzdGVuY2UgaXMgYW4gYWN0IG9mIHJlYmVsbGlvbg==
        </div>
        <div class="subtitle">
            [ click to decode | auto-redirect in 8s ]
        </div>
        <div class="subtitle">
            [ encrypted transmission ]
        </div>
    </div>

    <script>
        // Decode hint in console
        console.log('%c🔓 Encrypted Message:', 'font-size: 14px; font-weight: bold;');
        console.log('%cBase64 decode for meaning...', 'font-size: 12px; color: #666;');

        // Redirect after 8 seconds
        setTimeout(() => {
            document.body.classList.add('fade-out');
            setTimeout(() => {
                window.location.href = 'terminal.html';
            }, 1500);
        }, 8000);

        // Easter egg: Click to decode immediately
        document.querySelector('.encrypted-text').addEventListener('click', () => {
            const decoded = atob('dGhlIG9ubHkgd2F5IHRvIGRlYWwgd2l0aCBhbiB1bmZyZWUgd29ybGQgaXMgdG8gYmVjb21lIHNvIGFic29sdXRlbHkgZnJlZSB0aGF0IHlvdXIgdmVyeSBleGlzdGVuY2UgaXMgYW4gYWN0IG9mIHJlYmVsbGlvbg==');
            document.querySelector('.encrypted-text').textContent = decoded;
            document.querySelector('.encrypted-text').style.color = '#0a0a0a';
            document.querySelector('.encrypted-text').style.fontSize = '18px';
            document.querySelector('.encrypted-text').style.letterSpacing = '2px';
        });
    </script>
</body>
</html>
